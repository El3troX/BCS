<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSIT - Shuttle System Administrator Panel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-wrapper {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .admin-glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            border-radius: var(--radius-outer);
            padding: 32px;
            margin-bottom: 24px;
        }

        .admin-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .admin-title-group h2 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .admin-tab-btn {
            width: auto;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(14, 21, 38, 0.7);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-inner);
            margin-bottom: 0;
        }

        .admin-tab-btn:hover,
        .admin-tab-btn.active {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .admin-section {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .admin-section.active {
            display: block;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: var(--radius-inner);
            border: 1px solid var(--border-subtle);
            background: rgba(14, 21, 38, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(22, 32, 56, 0.8);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        td {
            padding: 14px 16px;
            font-size: 0.9rem;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .route-create-box {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
            background: rgba(14, 21, 38, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-inner);
            padding: 18px;
            margin-bottom: 20px;
            align-items: center;
        }

        .route-create-box input {
            margin-bottom: 0;
        }

        .route-create-box button {
            margin-bottom: 0;
            width: auto;
            white-space: nowrap;
        }

        .action-btn-sm {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            margin-bottom: 0;
            display: inline-flex;
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <header class="app-header" style="max-width: 100%;">
            <div class="brand-badge">
                <div class="brand-icon">👑</div>
                <span>BUSIT Management Console</span>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="index.html" style="color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    ← Student App
                </a>
                <button id="admin-logout-btn" class="btn-secondary" style="width: auto; padding: 6px 14px; margin-bottom: 0;">
                    Sign Out
                </button>
            </div>
        </header>

        <div class="admin-glass-panel">
            <div class="admin-header-row">
                <div class="admin-title-group">
                    <h2>Operations Dashboard</h2>
                    <p class="subtitle" style="margin-bottom: 0;">Monitor student cards, transactions, and shuttle fares</p>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="admin-tabs">
                <button id="tab-students" class="admin-tab-btn active">👥 All Students</button>
                <button id="tab-blocked" class="admin-tab-btn">🛡️ Blocked Cards</button>
                <button id="tab-transactions" class="admin-tab-btn">📊 System Transactions</button>
                <button id="tab-routes" class="admin-tab-btn">🚏 Routes & Fares</button>
            </div>

            <!-- Tab 1: Students -->
            <div id="section-students" class="admin-section active">
                <div class="table-responsive">
                    <table id="students-table">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Credits</th>
                                <th>Card Status</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Tab 2: Blocked Cards -->
            <div id="section-blocked" class="admin-section">
                <div class="table-responsive">
                    <table id="blocked-table">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Credits</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Tab 3: Transactions -->
            <div id="section-transactions" class="admin-section">
                <div class="table-responsive">
                    <table id="transactions-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Student ID</th>
                                <th>Transaction Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                    <button id="prev-tx-btn" class="btn-secondary" style="width: auto; padding: 8px 16px; margin: 0;">Previous</button>
                    <span id="tx-page-info" style="font-size: 0.85rem; color: var(--text-muted);">Page 1</span>
                    <button id="next-tx-btn" class="btn-secondary" style="width: auto; padding: 8px 16px; margin: 0;">Next</button>
                </div>
            </div>

            <!-- Tab 4: Routes -->
            <div id="section-routes" class="admin-section">
                <div class="route-create-box">
                    <input type="text" id="new-route-name" placeholder="Route Name (e.g. Main Campus to Tech Park)">
                    <input type="number" id="new-route-fare" placeholder="Fare (Credits)" min="1">
                    <button id="add-route-btn" class="btn-primary">＋ Create Route</button>
                </div>

                <div class="table-responsive">
                    <table id="routes-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Route Name</th>
                                <th>Fare (Credits)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
